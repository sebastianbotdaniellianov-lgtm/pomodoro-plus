<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro+</title>
<style>
  :root {
    --bg: #1a1b26;
    --bg-card: #20222f;
    --text: #e6e6ea;
    --text-dim: #8a8d9f;
    --accent: #ff6b6b;
    --accent-short: #4ecdc4;
    --accent-long: #ffd166;
    --border: #2e3042;
    --danger: #ff6b6b;
    --ok: #4ecdc4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 20px;
    letter-spacing: 0.5px;
  }
  h1 span { color: var(--accent); }

  .modes {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: var(--bg-card);
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .modes button {
    flex: 1;
    padding: 10px 6px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .modes button.active {
    background: var(--border);
    color: var(--text);
  }

  .timer-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 20px;
    text-align: center;
    margin-bottom: 20px;
  }
  .time {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    margin-bottom: 6px;
    transition: color 0.3s;
  }
  .session-label {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 24px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .controls button {
    padding: 12px 28px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .controls button:active { transform: scale(0.96); }
  #startPause {
    background: var(--accent);
    color: #1a1b26;
    min-width: 120px;
  }
  #reset {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border) !important;
  }

  .ring-wrap { position: relative; width: 100%; display: flex; justify-content: center; margin-bottom: 8px; }

  .task-input {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .task-input input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    font-size: 14px;
  }
  .task-input input:focus { outline: 1px solid var(--accent); }
  .task-input button {
    padding: 0 18px;
    border: none;
    border-radius: 10px;
    background: var(--border);
    color: var(--text);
    font-weight: 600;
    cursor: pointer;
  }

  .tasks {
    list-style: none;
    margin: 0 0 20px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .tasks li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
  }
  .tasks li.done .task-text { text-decoration: line-through; color: var(--text-dim); }
  .tasks li .task-text { flex: 1; word-break: break-word; }
  .tasks li .pomo-count {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--bg);
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .tasks li button.del {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
  }
  .tasks li button.del:hover { color: var(--danger); }
  .tasks li input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
  .tasks li.active-task { border-color: var(--accent); }

  .stats {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    justify-content: space-around;
    text-align: center;
  }
  .stats .stat-val { font-size: 22px; font-weight: 700; }
  .stats .stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

  .empty-hint { color: var(--text-dim); font-size: 13px; text-align: center; padding: 8px 0 14px; }
</style>
</head>
<body>
<div class="app">
  <h1>🍅 Pomodoro<span>+</span></h1>

  <div class="modes">
    <button data-mode="focus" class="active">Enfoque</button>
    <button data-mode="short">Descanso corto</button>
    <button data-mode="long">Descanso largo</button>
  </div>

  <div class="timer-card">
    <div class="time" id="time">25:00</div>
    <div class="session-label" id="sessionLabel">Listo para enfocarte</div>
    <div class="controls">
      <button id="startPause">Iniciar</button>
      <button id="reset">Reiniciar</button>
    </div>
  </div>

  <div class="task-input">
    <input type="text" id="taskInput" placeholder="¿En qué vas a trabajar?" maxlength="80">
    <button id="addTask">Añadir</button>
  </div>
  <ul class="tasks" id="taskList"></ul>
  <div class="empty-hint" id="emptyHint">Añade una tarea y selecciónala para enfocarte en ella.</div>

  <div class="stats">
    <div>
      <div class="stat-val" id="statToday">0</div>
      <div class="stat-label">Hoy</div>
    </div>
    <div>
      <div class="stat-val" id="statStreak">0</div>
      <div class="stat-label">Racha</div>
    </div>
    <div>
      <div class="stat-val" id="statTotal">0</div>
      <div class="stat-label">Total</div>
    </div>
  </div>
</div>

<script>
const DURATIONS = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
const LABELS = { focus: 'Enfoque en marcha', short: 'Tómate un respiro', long: 'Descanso largo' };
const COLORS = { focus: '#ff6b6b', short: '#4ecdc4', long: '#ffd166' };

let state = {
  mode: 'focus',
  secondsLeft: DURATIONS.focus,
  running: false,
  intervalId: null,
  tasks: [],
  activeTaskId: null,
  stats: { total: 0, streak: 0, lastDate: null, today: 0 }
};

const el = {
  time: document.getElementById('time'),
  sessionLabel: document.getElementById('sessionLabel'),
  startPause: document.getElementById('startPause'),
  reset: document.getElementById('reset'),
  taskInput: document.getElementById('taskInput'),
  addTask: document.getElementById('addTask'),
  taskList: document.getElementById('taskList'),
  emptyHint: document.getElementById('emptyHint'),
  statToday: document.getElementById('statToday'),
  statStreak: document.getElementById('statStreak'),
  statTotal: document.getElementById('statTotal'),
  modes: document.querySelectorAll('.modes button')
};

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function load() {
  try {
    const raw = localStorage.getItem('pomodoroPlusState');
    if (raw) {
      const saved = JSON.parse(raw);
      state.tasks = saved.tasks || [];
      state.activeTaskId = saved.activeTaskId || null;
      state.stats = saved.stats || state.stats;
    }
  } catch (e) {}

  const today = todayStr();
  if (state.stats.lastDate !== today) {
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    if (state.stats.lastDate !== yesterday) {
      state.stats.streak = 0;
    }
    state.stats.today = 0;
    state.stats.lastDate = today;
  }
}

function save() {
  try {
    localStorage.setItem('pomodoroPlusState', JSON.stringify({
      tasks: state.tasks,
      activeTaskId: state.activeTaskId,
      stats: state.stats
    }));
  } catch (e) {}
}

function formatTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function render() {
  el.time.textContent = formatTime(state.secondsLeft);
  el.time.style.color = COLORS[state.mode];
  el.sessionLabel.textContent = state.running ? LABELS[state.mode] : 'Listo para enfocarte';
  el.startPause.textContent = state.running ? 'Pausar' : (state.secondsLeft < DURATIONS[state.mode] ? 'Reanudar' : 'Iniciar');
  el.modes.forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
  document.title = `${formatTime(state.secondsLeft)} - Pomodoro+`;

  el.statToday.textContent = state.stats.today;
  el.statStreak.textContent = state.stats.streak;
  el.statTotal.textContent = state.stats.total;

  renderTasks();
}

function renderTasks() {
  el.taskList.innerHTML = '';
  el.emptyHint.style.display = state.tasks.length ? 'none' : 'block';
  state.tasks.forEach(task => {
    const li = document.createElement('li');
    li.className = (task.done ? 'done ' : '') + (task.id === state.activeTaskId ? 'active-task' : '');
    li.innerHTML = `
      <input type="checkbox" ${task.done ? 'checked' : ''} data-id="${task.id}" class="chk">
      <span class="task-text" data-id="${task.id}">${escapeHtml(task.text)}</span>
      <span class="pomo-count">🍅 ${task.pomos}</span>
      <button class="del" data-id="${task.id}" title="Eliminar">×</button>
    `;
    el.taskList.appendChild(li);
  });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function tick() {
  state.secondsLeft--;
  if (state.secondsLeft <= 0) {
    completeSession();
    return;
  }
  render();
}

function completeSession() {
  stopTimer();
  playBeep();
  notify();

  if (state.mode === 'focus') {
    state.stats.total++;
    state.stats.today++;
    const today = todayStr();
    if (state.stats.lastDate !== today) {
      state.stats.streak++;
      state.stats.lastDate = today;
    }
    const task = state.tasks.find(t => t.id === state.activeTaskId);
    if (task) task.pomos++;
    setMode(state.stats.total % 4 === 0 ? 'long' : 'short');
  } else {
    setMode('focus');
  }
  save();
  render();
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc.start();
    osc.stop(ctx.currentTime + 0.6);
  } catch (e) {}
}

function notify() {
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      new Notification('Pomodoro+', { body: state.mode === 'focus' ? '¡Sesión de enfoque terminada!' : '¡Descanso terminado!' });
    } catch (e) {}
  }
}

function startTimer() {
  if (state.running) return;
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  state.running = true;
  state.intervalId = setInterval(tick, 1000);
  render();
}

function stopTimer() {
  state.running = false;
  clearInterval(state.intervalId);
  state.intervalId = null;
  render();
}

function resetTimer() {
  stopTimer();
  state.secondsLeft = DURATIONS[state.mode];
  render();
}

function setMode(mode) {
  stopTimer();
  state.mode = mode;
  state.secondsLeft = DURATIONS[mode];
  render();
}

el.modes.forEach(btn => {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
});

el.startPause.addEventListener('click', () => {
  state.running ? stopTimer() : startTimer();
});

el.reset.addEventListener('click', resetTimer);

el.addTask.addEventListener('click', addTaskFromInput);
el.taskInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') addTaskFromInput();
});

function addTaskFromInput() {
  const text = el.taskInput.value.trim();
  if (!text) return;
  const task = { id: Date.now().toString(), text, done: false, pomos: 0 };
  state.tasks.push(task);
  if (!state.activeTaskId) state.activeTaskId = task.id;
  el.taskInput.value = '';
  save();
  render();
}

el.taskList.addEventListener('click', e => {
  const id = e.target.dataset.id;
  if (!id) return;
  if (e.target.classList.contains('chk')) {
    const task = state.tasks.find(t => t.id === id);
    if (task) task.done = e.target.checked;
    save();
    render();
  } else if (e.target.classList.contains('del')) {
    state.tasks = state.tasks.filter(t => t.id !== id);
    if (state.activeTaskId === id) state.activeTaskId = null;
    save();
    render();
  } else if (e.target.classList.contains('task-text')) {
    state.activeTaskId = state.activeTaskId === id ? null : id;
    save();
    render();
  }
});

load();
render();
</script>
</body>
</html>
